<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>사과 게임 (합 10 만들기)</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Jua&display=swap');

        body {
            font-family: 'Jua', sans-serif;
            background-color: #fce4ec; /* 연한 핑크 배경 */
            touch-action: none; /* 모바일에서 기본 스크롤 방지 */
            overflow: hidden;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            margin: 0;
            user-select: none; /* 텍스트 선택 방지 */
        }

        #game-board {
            display: grid;
            gap: 4px;
            background-color: #f8bbd0;
            padding: 8px;
            border-radius: 12px;
            box-shadow: 0 10px 20px rgba(0,0,0,0.1);
            position: relative;
        }

        .apple {
            width: 40px;
            height: 40px;
            background-color: #ff5252;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 20px;
            color: white;
            cursor: pointer;
            position: relative;
            box-shadow: inset -3px -3px 5px rgba(0,0,0,0.2), 0 3px 5px rgba(0,0,0,0.2);
            transition: transform 0.1s;
        }

        @media (min-width: 600px) {
            .apple {
                width: 50px;
                height: 50px;
                font-size: 24px;
            }
        }

        /* 사과 잎사귀 효과 */
        .apple::before {
            content: '';
            position: absolute;
            top: -5px;
            right: 10px;
            width: 12px;
            height: 8px;
            background-color: #4caf50;
            border-radius: 10px 0;
            box-shadow: inset -1px -1px 2px rgba(0,0,0,0.2);
        }
        
        .apple.selected {
            background-color: #ffca28; /* 선택 시 노란색 */
            transform: scale(1.1);
            z-index: 10;
        }

        .apple.empty {
            background-color: transparent;
            box-shadow: none;
            color: transparent;
            cursor: default;
        }
        
        .apple.empty::before {
            display: none;
        }

        #selection-box {
            position: absolute;
            border: 2px dashed #3f51b5;
            background-color: rgba(63, 81, 181, 0.2);
            pointer-events: none; /* 박스 자체가 마우스 이벤트를 받지 않도록 함 */
            display: none;
            z-index: 20;
        }

        /* 팝업 메시지 애니메이션 */
        @keyframes popOut {
            0% { transform: scale(0.5); opacity: 1; }
            50% { transform: scale(1.2); opacity: 1; }
            100% { transform: scale(1); opacity: 0; }
        }

        .score-popup {
            position: absolute;
            font-size: 24px;
            font-weight: bold;
            color: #ff9800;
            pointer-events: none;
            animation: popOut 1s ease-out forwards;
            z-index: 30;
            text-shadow: 2px 2px 0px white, -2px -2px 0px white, 2px -2px 0px white, -2px 2px 0px white;
        }

        /* 오버레이 화면 (시작/종료) */
        .overlay {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            background-color: rgba(255, 255, 255, 0.9);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            z-index: 100;
        }

        .hidden {
            display: none !important;
        }
    </style>
</head>
<body>

    <div class="w-full max-w-lg px-4 flex flex-col items-center">
        <!-- 상단 정보 패널 -->
        <div class="flex justify-between w-full mb-4 px-2 text-2xl font-bold text-gray-700">
            <div>점수: <span id="score" class="text-red-500">0</span></div>
            <div>남은 시간: <span id="timer" class="text-blue-500">120</span>초</div>
        </div>

        <!-- 게임 보드 -->
        <div id="game-board-container" class="relative">
            <div id="game-board"></div>
            <div id="selection-box"></div>
        </div>
        
        <!-- 하단 컨트롤 -->
        <button id="btn-hint" class="mt-6 px-6 py-2 bg-yellow-400 text-yellow-900 rounded-full font-bold shadow-md hover:bg-yellow-300 transition hidden">힌트 보기</button>
    </div>

    <!-- 시작 화면 -->
    <div id="start-screen" class="overlay">
        <h1 class="text-5xl text-red-500 mb-4 drop-shadow-md">사과 게임</h1>
        <p class="text-xl text-gray-600 mb-8 text-center px-4">
            드래그하여 사과들을 선택하세요.<br>
            선택한 사과들의 숫자의 <strong class="text-red-500">합이 10</strong>이 되면<br>
            사과가 사라지고 점수를 얻습니다!
        </p>
        <button id="btn-start" class="px-8 py-3 bg-red-500 text-white rounded-full text-2xl shadow-lg hover:bg-red-400 transition transform hover:scale-105">게임 시작</button>
    </div>

    <!-- 결과 화면 -->
    <div id="game-over-screen" class="overlay hidden">
        <h1 class="text-5xl text-blue-500 mb-4" id="result-title">게임 종료!</h1>
        <p class="text-2xl text-gray-700 mb-2">최종 점수: <span id="final-score" class="font-bold text-red-500">0</span></p>
        <p class="text-lg text-gray-500 mb-8" id="result-message"></p>
        <button id="btn-restart" class="px-8 py-3 bg-blue-500 text-white rounded-full text-2xl shadow-lg hover:bg-blue-400 transition transform hover:scale-105">다시 하기</button>
    </div>

    <script>
        const GRID_COLS = 17; // 열 개수
        const GRID_ROWS = 10; // 행 개수
        const TOTAL_TIME = 120; // 2분 (120초)

        let grid = [];
        let score = 0;
        let timeLeft = TOTAL_TIME;
        let timerInterval = null;
        let isDragging = false;
        let startPos = { x: 0, y: 0 };
        let currentPos = { x: 0, y: 0 };
        let selectedApples = new Set();
        let gameActive = false;

        const boardEl = document.getElementById('game-board');
        const selectionBoxEl = document.getElementById('selection-box');
        const scoreEl = document.getElementById('score');
        const timerEl = document.getElementById('timer');
        const startScreen = document.getElementById('start-screen');
        const gameOverScreen = document.getElementById('game-over-screen');
        const btnStart = document.getElementById('btn-start');
        const btnRestart = document.getElementById('btn-restart');
        const boardContainer = document.getElementById('game-board-container');

        function initGame() {
            grid = [];
            score = 0;
            timeLeft = TOTAL_TIME;
            selectedApples.clear();
            updateScore();
            updateTimerDisplay();
            
            boardEl.innerHTML = '';
            boardEl.style.gridTemplateColumns = `repeat(${GRID_COLS}, 1fr)`;
            boardEl.style.gridTemplateRows = `repeat(${GRID_ROWS}, 1fr)`;

            // 보드 채우기 (1~9 사이의 랜덤 숫자)
            for (let r = 0; r < GRID_ROWS; r++) {
                let row = [];
                for (let c = 0; c < GRID_COLS; c++) {
                    const num = Math.floor(Math.random() * 9) + 1; // 1~9
                    row.push(num);
                    
                    const apple = document.createElement('div');
                    apple.className = 'apple';
                    apple.dataset.row = r;
                    apple.dataset.col = c;
                    apple.textContent = num;
                    apple.id = `apple-${r}-${c}`;
                    boardEl.appendChild(apple);
                }
                grid.push(row);
            }
        }

        function startGame() {
            startScreen.classList.add('hidden');
            gameOverScreen.classList.add('hidden');
            initGame();
            gameActive = true;
            
            if (timerInterval) clearInterval(timerInterval);
            timerInterval = setInterval(() => {
                timeLeft--;
                updateTimerDisplay();
                if (timeLeft <= 0) {
                    endGame("시간 초과!");
                }
            }, 1000);
        }

        function endGame(message) {
            gameActive = false;
            clearInterval(timerInterval);
            
            document.getElementById('final-score').textContent = score;
            document.getElementById('result-message').textContent = message;
            
            // 모든 사과가 비었는지(클리어했는지) 확인
            const isClear = Array.from(boardEl.children).every(apple => apple.classList.contains('empty'));
            if(isClear) {
                document.getElementById('result-title').textContent = "성공!";
                document.getElementById('result-title').className = "text-5xl text-green-500 mb-4";
                score += timeLeft * 10; // 남은 시간 보너스
                document.getElementById('final-score').textContent = score;
            } else {
                document.getElementById('result-title').textContent = "게임 종료";
                document.getElementById('result-title').className = "text-5xl text-blue-500 mb-4";
            }
            
            gameOverScreen.classList.remove('hidden');
        }

        function updateScore() {
            scoreEl.textContent = score;
        }

        function updateTimerDisplay() {
            timerEl.textContent = timeLeft;
            if (timeLeft <= 10) {
                timerEl.classList.add('text-red-600', 'animate-pulse');
            } else {
                timerEl.classList.remove('text-red-600', 'animate-pulse');
            }
        }

        function getPointerPos(e) {
            // 터치 또는 마우스 이벤트 정규화
            const evt = e.touches ? e.touches[0] : e;
            const rect = boardContainer.getBoundingClientRect();
            // 보드 컨테이너 기준 상대 좌표
            return {
                x: evt.clientX - rect.left,
                y: evt.clientY - rect.top,
                clientX: evt.clientX,
                clientY: evt.clientY
            };
        }

        function handlePointerDown(e) {
            if (!gameActive) return;
            // e.preventDefault(); // 모바일 스크롤 방지를 위해 touch-action:none 사용함
            
            isDragging = true;
            const pos = getPointerPos(e);
            startPos = pos;
            
            // 박스 초기화
            selectionBoxEl.style.left = `${startPos.x}px`;
            selectionBoxEl.style.top = `${startPos.y}px`;
            selectionBoxEl.style.width = '0px';
            selectionBoxEl.style.height = '0px';
            selectionBoxEl.style.display = 'block';
            
            clearSelection();
            calculateSelection(pos);
        }

        function handlePointerMove(e) {
            if (!isDragging || !gameActive) return;
            // e.preventDefault();
            
            const pos = getPointerPos(e);
            currentPos = pos;
            
            // 드래그 박스 그리기
            const left = Math.min(startPos.x, currentPos.x);
            const top = Math.min(startPos.y, currentPos.y);
            const width = Math.abs(startPos.x - currentPos.x);
            const height = Math.abs(startPos.y - currentPos.y);
            
            selectionBoxEl.style.left = `${left}px`;
            selectionBoxEl.style.top = `${top}px`;
            selectionBoxEl.style.width = `${width}px`;
            selectionBoxEl.style.height = `${height}px`;

            calculateSelection(pos);
        }

        function calculateSelection(currentPosInfo) {
            clearSelection();
            
            const rectX1 = Math.min(startPos.clientX, currentPosInfo.clientX);
            const rectX2 = Math.max(startPos.clientX, currentPosInfo.clientX);
            const rectY1 = Math.min(startPos.clientY, currentPosInfo.clientY);
            const rectY2 = Math.max(startPos.clientY, currentPosInfo.clientY);

            const apples = document.querySelectorAll('.apple:not(.empty)');
            
            let sum = 0;
            
            apples.forEach(apple => {
                const rect = apple.getBoundingClientRect();
                const centerX = rect.left + rect.width / 2;
                const centerY = rect.top + rect.height / 2;

                // 사과의 중심점이 드래그 영역 안에 있는지 확인
                if (centerX >= rectX1 && centerX <= rectX2 && 
                    centerY >= rectY1 && centerY <= rectY2) {
                    
                    apple.classList.add('selected');
                    selectedApples.add(apple);
                    sum += parseInt(apple.textContent);
                }
            });
        }

        function clearSelection() {
            selectedApples.forEach(apple => {
                apple.classList.remove('selected');
            });
            selectedApples.clear();
        }

        function handlePointerUp(e) {
            if (!isDragging || !gameActive) return;
            isDragging = false;
            selectionBoxEl.style.display = 'none';

            let sum = 0;
            selectedApples.forEach(apple => {
                sum += parseInt(apple.textContent);
            });

            if (sum === 10 && selectedApples.size > 0) {
                removeSelectedApples();
            } else {
                clearSelection();
            }
        }

        function removeSelectedApples() {
            const numCleared = selectedApples.size;
            score += numCleared * 10; // 없앤 사과 개수만큼 점수 비례
            updateScore();

            // 점수 팝업 애니메이션 (마지막으로 선택된 영역의 중심쯤)
            if (numCleared > 0) {
                const arr = Array.from(selectedApples);
                const lastApple = arr[arr.length - 1];
                const rect = lastApple.getBoundingClientRect();
                const containerRect = boardContainer.getBoundingClientRect();
                
                showScorePopup(`+${numCleared * 10}`, rect.left - containerRect.left, rect.top - containerRect.top);
            }

            selectedApples.forEach(apple => {
                apple.classList.remove('selected');
                apple.classList.add('empty');
                apple.textContent = ''; // 텍스트 제거
                // 상태 데이터 업데이트
                grid[apple.dataset.row][apple.dataset.col] = 0;
            });
            
            selectedApples.clear();
            
            checkGameClear();
        }

        function showScorePopup(text, x, y) {
            const popup = document.createElement('div');
            popup.className = 'score-popup';
            popup.textContent = text;
            popup.style.left = `${x}px`;
            popup.style.top = `${y}px`;
            boardContainer.appendChild(popup);
            
            setTimeout(() => {
                popup.remove();
            }, 1000);
        }

        function checkGameClear() {
            // 모든 셀이 0인지 확인
            const isClear = grid.every(row => row.every(val => val === 0));
            if (isClear) {
                endGame("모든 사과를 없앴습니다!");
            } else {
                // 더 이상 10을 만들 수 없는 상태인지 검사하는 로직은 복잡도가 높고 
                // 빈 공간이 많아져 드래그로 조합하기 어려울 수 있으므로 생략합니다.
            }
        }

        // 마우스 이벤트
        boardContainer.addEventListener('mousedown', handlePointerDown);
        window.addEventListener('mousemove', handlePointerMove);
        window.addEventListener('mouseup', handlePointerUp);

        // 터치 이벤트
        boardContainer.addEventListener('touchstart', handlePointerDown, {passive: false});
        window.addEventListener('touchmove', handlePointerMove, {passive: false});
        window.addEventListener('touchend', handlePointerUp);

        // 버튼 이벤트
        btnStart.addEventListener('click', startGame);
        btnRestart.addEventListener('click', startGame);

    </script>
</body>
</html>
