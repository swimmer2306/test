<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>스네이크 게임</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body {
            touch-action: none; /* 모바일에서 스크롤 방지 */
        }
        canvas {
            image-rendering: pixelated;
        }
    </style>
</head>
<body class="bg-gray-900 text-white flex flex-col items-center justify-center min-h-screen p-4 font-sans">

    <div class="max-w-md w-full bg-gray-800 p-6 rounded-xl shadow-2xl border border-gray-700">
        <div class="flex justify-between items-center mb-4">
            <h1 class="text-2xl font-bold text-green-400">SNAKE</h1>
            <div class="text-xl font-mono">점수: <span id="scoreDisplay">0</span></div>
        </div>

        <div class="relative w-full aspect-square bg-gray-950 rounded-lg overflow-hidden border-2 border-gray-700">
            <canvas id="gameCanvas" width="400" height="400" class="w-full h-full block"></canvas>
            
            <!-- 오버레이 화면 (시작 / 게임오버) -->
            <div id="overlay" class="absolute inset-0 bg-black/70 flex flex-col items-center justify-center">
                <h2 id="overlayTitle" class="text-3xl font-bold mb-4 text-white">스네이크 게임</h2>
                <p id="overlayMessage" class="text-gray-300 mb-6 text-center px-4">방향키 또는 아래 버튼을 사용하여<br>뱀을 조종하세요.</p>
                <button id="startBtn" class="px-6 py-3 bg-green-500 hover:bg-green-600 text-white font-bold rounded-lg transition-colors shadow-lg">
                    게임 시작
                </button>
            </div>
        </div>

        <!-- 모바일 컨트롤러 -->
        <div class="mt-6 grid grid-cols-3 gap-2 max-w-[200px] mx-auto md:hidden">
            <div></div>
            <button class="control-btn bg-gray-700 hover:bg-gray-600 active:bg-gray-500 p-4 rounded-lg flex justify-center items-center" data-dir="up">
                <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 15l7-7 7 7"></path></svg>
            </button>
            <div></div>
            <button class="control-btn bg-gray-700 hover:bg-gray-600 active:bg-gray-500 p-4 rounded-lg flex justify-center items-center" data-dir="left">
                <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 19l-7-7 7-7"></path></svg>
            </button>
            <button class="control-btn bg-gray-700 hover:bg-gray-600 active:bg-gray-500 p-4 rounded-lg flex justify-center items-center" data-dir="down">
                <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 9l-7 7-7-7"></path></svg>
            </button>
            <button class="control-btn bg-gray-700 hover:bg-gray-600 active:bg-gray-500 p-4 rounded-lg flex justify-center items-center" data-dir="right">
                <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 5l7 7-7 7"></path></svg>
            </button>
        </div>
    </div>

    <script>
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');
        const scoreDisplay = document.getElementById('scoreDisplay');
        const overlay = document.getElementById('overlay');
        const overlayTitle = document.getElementById('overlayTitle');
        const overlayMessage = document.getElementById('overlayMessage');
        const startBtn = document.getElementById('startBtn');
        const controlBtns = document.querySelectorAll('.control-btn');

        // 게임 설정값
        const gridSize = 20;
        const tileCount = canvas.width / gridSize;
        const gameSpeed = 100; // 밀리초 단위 (낮을수록 빠름)

        // 게임 상태 변수
        let snake = [];
        let food = { x: 15, y: 15 };
        let dx = 0;
        let dy = 0;
        let score = 0;
        let gameLoop;
        let isPlaying = false;
        let nextDx = 0;
        let nextDy = 0;

        function initGame() {
            snake = [
                { x: 10, y: 10 },
                { x: 9, y: 10 },
                { x: 8, y: 10 }
            ];
            dx = 1;
            dy = 0;
            nextDx = 1;
            nextDy = 0;
            score = 0;
            scoreDisplay.textContent = score;
            placeFood();
        }

        function placeFood() {
            food = {
                x: Math.floor(Math.random() * tileCount),
                y: Math.floor(Math.random() * tileCount)
            };
            // 먹이가 뱀의 몸통 위에 생성되지 않도록 검증
            for (let part of snake) {
                if (part.x === food.x && part.y === food.y) {
                    placeFood();
                    break;
                }
            }
        }

        function update() {
            // 입력된 방향 적용
            dx = nextDx;
            dy = nextDy;

            // 새 머리 위치 계산
            const head = { x: snake[0].x + dx, y: snake[0].y + dy };

            // 벽 충돌 판정
            if (head.x < 0 || head.x >= tileCount || head.y < 0 || head.y >= tileCount) {
                gameOver();
                return;
            }

            // 자기 몸 충돌 판정
            for (let i = 0; i < snake.length; i++) {
                if (head.x === snake[i].x && head.y === snake[i].y) {
                    gameOver();
                    return;
                }
            }

            snake.unshift(head); // 머리 추가

            // 먹이 획득 판정
            if (head.x === food.x && head.y === food.y) {
                score += 10;
                scoreDisplay.textContent = score;
                placeFood();
            } else {
                snake.pop(); // 꼬리 자르기
            }
        }

        function draw() {
            // 배경 지우기 (투명 처리하여 CSS 배경이 보이게 함)
            ctx.clearRect(0, 0, canvas.width, canvas.height);

            // 먹이 그리기
            ctx.fillStyle = '#ef4444'; // Tailwind red-500
            ctx.beginPath();
            ctx.arc(food.x * gridSize + gridSize / 2, food.y * gridSize + gridSize / 2, gridSize / 2.5, 0, Math.PI * 2);
            ctx.fill();

            // 뱀 그리기
            snake.forEach((part, index) => {
                ctx.fillStyle = index === 0 ? '#4ade80' : '#22c55e'; // 머리는 밝은 초록, 몸통은 일반 초록
                
                // 테두리를 줘서 타일 구분
                ctx.fillRect(part.x * gridSize + 1, part.y * gridSize + 1, gridSize - 2, gridSize - 2);
            });
        }

        function loop() {
            if (!isPlaying) return;
            update();
            if (isPlaying) {
                draw();
                gameLoop = setTimeout(loop, gameSpeed);
            }
        }

        function startGame() {
            initGame();
            isPlaying = true;
            overlay.style.display = 'none';
            loop();
        }

        function gameOver() {
            isPlaying = false;
            clearTimeout(gameLoop);
            overlayTitle.textContent = '게임 오버!';
            overlayMessage.innerHTML = `최종 점수: <strong class="text-white">${score}</strong><br>다시 도전하시겠습니까?`;
            startBtn.textContent = '다시 시작';
            overlay.style.display = 'flex';
        }

        // 키보드 입력 처리
        window.addEventListener('keydown', (e) => {
            if (!isPlaying) return;
            
            // 현재 이동 방향과 반대 방향으로는 즉시 꺾을 수 없음
            switch (e.key) {
                case 'ArrowUp':
                case 'w':
                case 'W':
                    if (dy !== 1) { nextDx = 0; nextDy = -1; }
                    break;
                case 'ArrowDown':
                case 's':
                case 'S':
                    if (dy !== -1) { nextDx = 0; nextDy = 1; }
                    break;
                case 'ArrowLeft':
                case 'a':
                case 'A':
                    if (dx !== 1) { nextDx = -1; nextDy = 0; }
                    break;
                case 'ArrowRight':
                case 'd':
                case 'D':
                    if (dx !== -1) { nextDx = 1; nextDy = 0; }
                    break;
            }
        });

        // 모바일 버튼 입력 처리
        controlBtns.forEach(btn => {
            btn.addEventListener('touchstart', (e) => {
                e.preventDefault(); // 터치 시 더블탭 줌 등 기본 동작 방지
                if (!isPlaying) return;
                
                const dir = btn.getAttribute('data-dir');
                switch (dir) {
                    case 'up': if (dy !== 1) { nextDx = 0; nextDy = -1; } break;
                    case 'down': if (dy !== -1) { nextDx = 0; nextDy = 1; } break;
                    case 'left': if (dx !== 1) { nextDx = -1; nextDy = 0; } break;
                    case 'right': if (dx !== -1) { nextDx = 1; nextDy = 0; } break;
                }
            });
        });

        // 시작 버튼 이벤트
        startBtn.addEventListener('click', startGame);

        // 초기 화면 렌더링
        draw();

    </script>
</body>
</html>
